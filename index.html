<style>
:root{--gold:#E8A90C;--gold2:#F5C542;--dark:#2A2C31;--dark2:#3A3D44;--bg:#F4F4F2;--card:#fff;--line:#E2E2DE;--txt:#1F2023;--mut:#6B6E75;--red:#C0392B;--green:#1E8449}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
header{background:var(--dark);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.logo{font-weight:800;letter-spacing:1px;font-size:18px}
.logo b{color:var(--gold)}
.sub{font-size:12px;color:#C9CBD0}
nav{display:flex;gap:4px;overflow-x:auto;background:var(--dark2);padding:6px 8px;position:sticky;top:52px;z-index:19}
nav button{background:transparent;border:0;color:#D8DADF;font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--gold);color:var(--dark)}
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.card h3:before{content:"";width:5px;height:18px;background:var(--gold);border-radius:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px;font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid #CFCFCA;border-radius:8px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold2);border-color:var(--gold)}
.btn{font:inherit;font-weight:700;border:0;border-radius:9px;padding:9px 16px;cursor:pointer;background:var(--gold);color:var(--dark)}
.btn.dark{background:var(--dark);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--txt)}
.btn.red{background:#fff;border:1px solid #E8B4AE;color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--txt)}
.chk input{width:20px;height:20px;accent-color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--dark);color:#fff;font-weight:600;padding:7px 6px;text-align:right}
td{border-bottom:1px solid var(--line);padding:6px}
tr.grp td{background:#FFF6DC;font-weight:700}
tr.tot td{font-weight:800;background:#F1F1EE}
.tw{overflow-x:auto}
td input{padding:5px 6px;font-size:13px;min-width:60px}
.num{direction:ltr;text-align:left;white-space:nowrap}
.win{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.win .t{font-weight:700}
.win .d{font-size:12.5px;color:var(--mut)}
.price{font-weight:800;color:var(--dark);font-size:16px}
.big{font-size:22px;font-weight:800}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kpi div{background:#FAFAF8;border:1px solid var(--line);border-radius:10px;padding:10px}
.kpi small{display:block;color:var(--mut);font-size:12px}
.kpi b{font-size:17px}
details summary{cursor:pointer;font-weight:700;color:var(--mut);font-size:13px;padding:6px 0}
.hint{font-size:12px;color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:20px 10px}
.modal.on{display:flex}
.modal .card{width:100%;max-width:560px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:60}
.pill{display:inline-block;background:#FFF1C7;color:#7A5A00;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:700}
#print{display:none}
/* ---- print docs ---- */
.doc{font-family:Cairo,Tahoma,sans-serif;color:#111;padding:6mm}
.doc .hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:4px solid var(--gold);padding-bottom:8px;margin-bottom:12px}
.doc .brand{font-size:26px;font-weight:800;letter-spacing:2px;color:var(--dark)}
.doc .brand b{color:var(--gold)}
.doc .meta{font-size:12px;text-align:left;line-height:1.7}
.doc h2{font-size:17px;margin:10px 0 6px;background:var(--dark);color:#fff;padding:5px 10px;border-radius:5px}
.doc table{font-size:12px}
.doc th{background:#3A3D44}
.doc .info{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;font-size:13px;margin-bottom:10px}
.doc .totbox{margin-top:10px;margin-right:auto;width:300px;border:2px solid var(--dark);border-radius:6px;overflow:hidden}
.doc .totbox div{display:flex;justify-content:space-between;padding:6px 10px;font-size:13px}
.doc .totbox .g{background:var(--gold);font-weight:800;font-size:15px}
.doc .ft{margin-top:18px;font-size:11.5px;color:#444;border-top:1px solid #ccc;padding-top:6px}
.doc .win-blk{page-break-inside:avoid;margin-bottom:10px}
@media print{
  @page{size:A4;margin:8mm}
  body{background:#fff}
  header,nav,main,.modal,.toast{display:none!important}
  #print{display:block}

  .doc *{-webkit-print-color-adjust:exact;print-color-adjust:exact}

@media(max-width:600px){main{padding:10px}.card{padding:11px}th,td{padding:5px 4px}}

const r2=x=>Math.round(x*100)/100;
const f2=x=>(isFinite(x)?x:0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
const f0=x=>Math.round(x||0).toLocaleString('en-US');
function calcWindow(win,P,FX){
  const cat=P.cat, W=+win.w*100||0, HT=+win.h*100||0;
  const F=win.fix?(+win.fixH*100||0):0, H=Math.max(HT-F,0);
  const groups={base:1,mesh:!!win.mesh,track:!!win.track,fix:!!win.fix};
  const L={'W':W,'W/2':W/2,'W/3':W/3,'W+10':W+10,'H':H,'HT':HT,'HT+10':HT+10,'F':F,'SAS':win.sasDir==='W'?W:F};
  const {type}=getST(cat,win);
  const prof=id=>cat.profiles.find(p=>p.id===id)||{name:'?',code:'',w:0};
  const accOf=id=>cat.acc.find(a=>a.id===id)||{name:'?',code:'',price:0,unit:'pc'};
  const rules=type.rules;
  const cuts=[];let raw=0;
  rules.forEach(r=>{ if(!groups[r.g]||!(+r.n)) return; const p=prof(r.p); const len=r2(L[r.len]||0); const tot=len*r.n; const kg=p.w*tot/100; raw+=kg;
    cuts.push({g:r.g,pid:r.p,name:p.name,code:p.code,n:+r.n,len,tot,w:p.w,kg}); });
  const col=win.color||P.color||'', wf=1+(+P.waste||0)/100;
  const weight=(P.aluMode==='bars'&&FX)?cuts.reduce((s,x)=>s+x.kg*(FX[(x.code||x.name)+'|'+col]||wf),0):raw*wf;
  const aRules=type.accRules; const HTm=HT/100;
  const accs=[];let accRaw=0; const Wm=W/100,Hm=H/100,Fm=F/100;
  aRules.forEach(r=>{ if(!groups[r.g]) return; const a=accOf(r.a); let q;
    if(r.hinge) q=(type.leaves||1)*(H<=(+r.hMax||100)?(+r.nLow||2):(+r.nHigh||3)); else if(r.ofP) q=(+r.k||1)*cuts.filter(x=>x.pid===r.ofP&&x.g==='base').reduce((s,x)=>s+x.tot,0)/100; else if(r.n!=null) q=+r.n; else if(r.kwh!=null) q=r.kwh*Wm*Hm; else if(r.perim) q=r.perim*(2*Wm+2*Fm); else q=(+r.kw||0)*Wm+(+r.kh||0)*Hm+(+r.kht||0)*HTm+(+r.kf||0)*Fm;
    if(!q) return; const cost=q*a.price; accRaw+=cost; accs.push({g:r.g,name:a.name,code:a.code,unit:a.unit,q,price:a.price,cost}); });
  const accCost=accRaw*(1+(+P.accWaste||0)/100);
  const area=W*HT/10000;
  const alu=weight*(+P.kgPrice||0);
  const gp=(win.glassPrice!==''&&win.glassPrice!=null&&!isNaN(+win.glassPrice))?+win.glassPrice:(+P.glassPrice||0);
  const gname=win.glassName||P.glassName||'';
  const glass=area*gp*(1+(+P.glassWaste||0)/100);
  const paint=weight*(+P.paintRate||0);
  const extra=+win.extra||0, extraName=win.extraName||'';
  const sub=alu+accCost+glass+paint+extra;
  const labor=sub*(+P.laborPct||0)/100;
  const unit=sub+labor, qty=+win.qty||1;
  return {gp,gname,col,colCode:win.colorCode||P.colorCode||'',W,H,HT,F,cuts,raw,weight,accs,accRaw,accCost,area,alu,glass,paint,extra,extraName,sub,labor,unit,qty,total:unit*qty,perM:area?unit/area:0};
}
function calcProject(P){
  const O=P.aluMode==='bars'?optimizeProject(P):null, FX=O?O.factors:null;
  const res=P.windows.map(w=>({win:w,c:calcWindow(w,P,FX)}));
  const sum=res.reduce((s,x)=>s+x.c.total,0);
  const adds=(P.adds||[]).filter(a=>+a.amount), addSum=adds.reduce((s,a)=>s+(+a.amount),0);
  const gross=sum+addSum, discPct=+P.discPct||0, disc=gross*discPct/100;
  const before=gross-disc, taxPct=+P.taxPct||0, tax=before*taxPct/100;
  return {O,FX,res,sum,disc,discPct,gross,adds,addSum,before,taxPct,tax,net:before+tax,count:res.reduce((s,x)=>s+x.c.qty,0),area:res.reduce((s,x)=>s+x.c.area*x.c.qty,0),weight:res.reduce((s,x)=>s+x.c.weight*x.c.qty,0)};
}

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function bfd(items,L,k){const bins=[];for(const it of items){const need=it.len+k;let best=null,br=Infinity;
  for(const b of bins){const rem=b.L+k-b.used;if(rem>=need-1e-9&&rem-need<br){best=b;br=rem-need}}
  if(!best){best={L,used:0,items:[]};bins.push(best)}best.items.push(it);best.used+=need}return bins}
function downsize(bins,lens,k){const asc=lens.slice().sort((a,b)=>a-b);bins.forEach(b=>{for(const l of asc){if(l+k>=b.used-1e-9){b.L=l;break}}});return bins}
function optimizeKey(items,lens,k){
  const maxL=Math.max(...lens),over=items.filter(i=>i.len>maxL),ok=items.filter(i=>i.len<=maxL);
  const sorted=ok.slice().sort((a,b)=>b.len-a.len);let best=null;
  const consider=bins=>{const sc=bins.reduce((s,b)=>s+b.L,0),n=bins.length,ml=Math.max(0,...bins.map(b=>b.L+k-b.used));
    if(!best||sc<best.sc-1e-9||(Math.abs(sc-best.sc)<1e-9&&(n<best.n||(n===best.n&&ml>best.ml+1e-9))))best={sc,n,ml,bins}};
  lens.forEach(L=>consider(downsize(bfd(sorted,L,k),lens,k)));
  if(ok.length>1){const R=rng(ok.length*7919+Math.round(ok.reduce((s,i)=>s+i.len,0))),it=Math.min(400,Math.max(40,Math.floor(30000/ok.length)));
    for(let t=0;t<it;t++){const amp=0.04+0.3*R();const per=ok.map(i=>({i,key:i.len*(1+amp*R())})).sort((a,b)=>b.key-a.key).map(x=>x.i);
      lens.forEach(L=>consider(downsize(bfd(per,L,k),lens,k)))}}
  return {bins:best?best.bins:[],over};
}
let OPT_LAST={key:null,val:null};
function optimizeProject(P){
  const s=DB.settings,lens=(s.barMode==='best'?s.bars:[s.bars[s.barMode==='b'?1:0]]).map(Number).filter(x=>x>0);
  const k=+s.kerf||0,groups={};
  P.windows.forEach((w,i)=>{const c=calcWindow(w,P),col=w.color||P.color||'';c.cuts.forEach(x=>{if(!(x.len>0))return;const key=(x.code||x.name)+'|'+col;
    const g=groups[key]||(groups[key]={key,code:x.code,name:x.name,color:col,w:x.w,items:[]});
    for(let j=0;j<x.n*c.qty;j++)g.items.push({len:x.len,tag:i+1})})});
  const sig=JSON.stringify([lens,k,P.kgPrice,Object.values(groups).map(g=>[g.key,g.w,g.items.map(i=>i.len+'/'+i.tag).join(',')])]);
  if(OPT_LAST.key===sig)return OPT_LAST.val;
  const out={groups:[],factors:{},lens,kerf:k,net:0,bought:0,buyKg:0,netKg:0,cost:0,count:{}};
  Object.values(groups).forEach(g=>{const r=optimizeKey(g.items,lens,k);
    const net=g.items.reduce((s,i)=>s+i.len,0),bought=r.bins.reduce((s,b)=>s+b.L,0)+r.over.reduce((s,i)=>s+i.len,0);
    const count={};r.bins.forEach(b=>count[b.L]=(count[b.L]||0)+1);
    const netKg=g.w*net/100,buyKg=g.w*bought/100,cost=buyKg*(+P.kgPrice||0);
    const pats={};r.bins.forEach(b=>{const ls=b.items.map(i=>i.len).sort((a,b)=>b-a);const key=b.L+':'+ls.join('+');
      const o=pats[key]||(pats[key]={L:b.L,ls,left:Math.max(b.L+k-b.used,0),n:0,tags:new Set()});o.n++;b.items.forEach(i=>o.tags.add(i.tag))});
    const G=Object.assign({},g,{net,bought,count,netKg,buyKg,cost,waste:bought-net,wastePct:bought?(bought-net)/bought*100:0,over:r.over,pats:Object.values(pats).sort((a,b)=>b.L-a.L||b.n-a.n),bars:r.bins.length});
    out.groups.push(G);out.factors[g.key]=netKg?buyKg/netKg:1;out.net+=net;out.bought+=bought;out.netKg+=netKg;out.buyKg+=buyKg;out.cost+=cost;
    Object.entries(count).forEach(([L,n])=>out.count[L]=(out.count[L]||0)+n)});
  OPT_LAST={key:sig,val:out};return out;
}

function cutTable(c,mult=1){
  let h='<div class="tw"><table><tr><th>القطعة</th><th>الكود</th><th>العدد</th><th>الطول سم</th><th>إجمالي الطول م</th><th>الوزن كجم</th></tr>';
  Object.keys(GROUPS).forEach(g=>{const rows=c.cuts.filter(x=>x.g===g);if(!rows.length)return;
    h+=`<tr class="grp"><td colspan="6">${GROUPS[g]}</td></tr>`;
    rows.forEach(x=>h+=`<tr><td>${esc(x.name)}</td><td class="num">${esc(x.code)}</td><td>${x.n*mult}</td><td class="num">${f2(x.len)}</td><td class="num">${f2(x.tot*mult/100)}</td><td class="num">${f2(x.kg*mult)}</td></tr>`)});
  h+=`<tr class="tot"><td colspan="5">الوزن الصافي${mult>1?' (× '+mult+')':''}</td><td class="num">${f2(c.raw*mult)}</td></tr></table></div>`;return h;
}
function accTable(c){

  Object.keys(GROUPS).forEach(g=>{const rows=c.accs.filter(x=>x.g===g);if(!rows.length)return;
    h+=`<tr class="grp"><td colspan="5">${GROUPS[g]}</td></tr>`;
    rows.forEach(x=>h+=`<tr><td>${esc(x.name)}</td><td class="num">${esc(x.code)}</td><td class="num">${f2(x.q)} ${x.unit==='m'?'م':x.unit==='m2'?'م²':''}</td><td class="num">${f2(x.price)}</td><td class="num">${f2(x.cost)}</td></tr>`)});
  h+=`<tr class="tot"><td colspan="4">الإجمالي + هالك ${DB.cur.accWaste}%</td><td class="num">${f2(c.accCost)}</td></tr></table></div>`;return h;
}

function accAgg(P){const by={};P.windows.forEach(w=>{const c=calcWindow(w,P);c.accs.forEach(x=>{const k=x.code+'|'+x.name;const o=by[k]||(by[k]={name:x.name,code:x.code,unit:x.unit,q:0,cost:0});o.q+=x.q*c.qty;o.cost+=x.cost*c.qty})});return Object.values(by)}
function purchaseTable(O,P){
  const lens=O.lens;
  let h=`<div class="tw"><table><tr><th>القطاع</th><th>الكود</th><th>اللون</th><th>صافي القص م</th>${lens.map(l=>`<th>أعواد ${barName(l)}</th>`).join('')}<th>الهالك</th><th>وزن الشراء كجم</th><th>التكلفة</th></tr>`;
  O.groups.forEach(g=>{h+=`<tr><td>${esc(g.name)}</td><td class="num">${esc(g.code)}</td><td>${esc(g.color||'—')}</td><td class="num">${mL(g.net)}</td>${lens.map(l=>`<td class="num"><b>${g.count[l]||0}</b></td>`).join('')}<td class="num">${mL(g.waste)} م (${f2(g.wastePct)}%)</td><td class="num">${f2(g.buyKg)}</td><td class="num">${f0(g.cost)}</td></tr>`;
    if(g.over.length)h+=`<tr><td colspan="${7+lens.length}" style="color:var(--red)">⚠️ ${g.over.length} قطعة أطول من أطول عود (${g.over.map(i=>f2(i.len)).join('، ')} سم) – محسوبة بطولها ومحتاجة لحام أو عود خاص</td></tr>`});
  const wp=O.bought?(O.bought-O.net)/O.bought*100:0;
  h+=`<tr class="tot"><td colspan="3">الإجمالي</td><td class="num">${mL(O.net)}</td>${lens.map(l=>`<td class="num">${O.count[l]||0}</td>`).join('')}<td class="num">${mL(O.bought-O.net)} م (${f2(wp)}%)</td><td class="num">${f2(O.buyKg)}</td><td class="num">${f0(O.cost)}</td></tr></table></div>
  <p class="hint">التكلفة = وزن الأعواد المشتراة × سعر الكيلو (${f2(P.kgPrice)}). سمك سلاح المنشار ${f2(O.kerf)} سم لكل قصة. الأعواد: ${lens.map(barName).join(' و ')}.</p>`;
  return h;
}

function printDoc(kind){

  const old=document.title; document.title=(kind==='quote'?'عرض سعر':kind==='cut'?'كشف تقطيع':kind==='buy'?'كشف مشتريات':'تكلفة')+' - '+(P.client||'')+' '+(P.no||'');

function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportCSV(){
  const P=DB.cur,O=optimizeProject(P),rows=[['كشف تقطيع ومشتريات',SYS_NAME,P.client,P.date],[]];
  rows.push(['أمر شراء الألومنيوم']);rows.push(['القطاع','الكود','اللون','صافي م',...O.lens.map(l=>'أعواد '+l/100+' م'),'الهالك م','الهالك %','وزن الشراء كجم','التكلفة']);
  O.groups.forEach(g=>rows.push([g.name,g.code,g.color,r2(g.net/100),...O.lens.map(l=>g.count[l]||0),r2(g.waste/100),r2(g.wastePct),r2(g.buyKg),r2(g.cost)]));
  rows.push([]);rows.push(['توزيع القصات']);rows.push(['القطاع','الكود','اللون','العود م','العدد','القصات سم','المتبقي سم','شبابيك']);
  O.groups.forEach(g=>g.pats.forEach(p=>rows.push([g.name,g.code,g.color,p.L/100,p.n,p.ls.join(' + '),r2(p.left),[...p.tags].map(t=>'#'+t).join(' ')])));
  rows.push([]);rows.push(['الإكسسوار','الكود','الكمية']);accAgg(P).forEach(o=>rows.push([o.name,o.code,r2(o.q)]));rows.push([]);
  P.windows.forEach((w,i)=>{const c=calcWindow(w,P);rows.push([(i+1)+'. '+winTitle(w,i),winDesc(w),'العدد',c.qty]);rows.push(['القطعة','الكود','العدد','الطول سم','إجمالي م','الوزن كجم']);
    c.cuts.forEach(x=>rows.push([x.name,x.code,x.n*c.qty,x.len,r2(x.tot*c.qty/100),r2(x.kg*c.qty)]));rows.push([])});
  const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  download('تقطيع-ومشتريات-'+(P.client||'مشروع')+'.csv',csv,'text/csv;charset=utf-8');
}

    body=`<div class="row" style="margin-bottom:6px">${cat.systems.map(x=>`<button class="btn ${SYS_.id===x.id?'dark':'ghost'} sm" onclick="SSYS='${x.id}';STID=null;render()">${esc(x.name)}</button>`).join('')}</div>
    <div class="row" style="margin-bottom:10px">${SYS_.types.map(t=>`<button class="btn ${T_.id===t.id?'':'ghost'} sm" onclick="STID='${t.id}';render()">${esc(t.name)}</button>`).join('')}</div>
    <div class="card"><h3>القطاعات – ${esc(SYS_.name)} ${esc(T_.name)}</h3><div class="tw"><table><tr><th>المجموعة</th><th>القطاع</th><th>الطول</th><th>العدد</th><th></th></tr>
    ${rules.map((r,i)=>`<tr><td><select onchange="setRule('p',${i},'g',this.value)">${Object.entries(GROUPS).map(([k,t])=>`<option value="${k}" ${k===r.g?'selected':''}>${t}</option>`).join('')}</select></td>
      <td><select onchange="setRule('p',${i},'p',this.value)">${pOpt(r.p)}</select></td><td><select onchange="setRule('p',${i},'len',this.value)">${lOpt(r.len)}</select></td>
      <td><input type="number" step="any" value="${r.n}" style="width:70px" oninput="setRule('p',${i},'n',+this.value)"></td><td><button class="btn red sm" onclick="delRule(${i})">✕</button></td></tr>`).join('')}
    </table></div><button class="btn ghost sm" style="margin-top:8px" onclick="addRule()">+ إضافة سطر قطاع</button></div>
    <div class="card"><h3>الإكسسوار – ${esc(SYS_.name)} ${esc(T_.name)}</h3><p class="hint">العرض والارتفاع هنا بالمتر. ارتفاع الضلف = الارتفاع الكلي − الثابت.</p><div class="tw"><table><tr><th>المجموعة</th><th>الصنف</th><th>الكمية</th></tr>
    ${ar.map((r,i)=>accRow(r,i,'a')).join('')}</table></div>
    <details style="margin-top:8px"><summary>+ إضافة صنف لهذا النوع</summary><div class="grid">
     <div><label>الصنف</label><select id="ar_a">${cat.acc.map(a=>`<option value="${a.id}">${esc(a.name)} ${esc(a.code)}</option>`).join('')}</select></div>
     <div><label>المجموعة</label><select id="ar_g">${Object.entries(GROUPS).map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select></div>
     <div><label>العدد (للقطعة) أو معامل</label><input id="ar_n" type="number" step="any" value="1"></div></div>
     <p class="hint">لو الصنف بالمتر هيتحسب = المعامل × العرض، وعدّل المعامل بعد الإضافة.</p><button class="btn sm" onclick="addAccRule()">إضافة</button></details>
    </div>
    <div class="row"><button class="btn red sm" onclick="resetCat()">استرجاع القيم الأصلية من ملف Excel</button></div>`;
  } else {
    const n=(l,p,step='any')=>`<div><label>${l}</label><input type="number" step="${step}" value="${esc(p.split('.').reduce((o,k)=>o[k],s))}" oninput="setS('${p}',+this.value)"></div>`;
    const t=(l,p)=>`<div><label>${l}</label><input value="${esc(p.split('.').reduce((o,k)=>o[k],s))}" oninput="setS('${p}',this.value)"></div>`;
    body=`<div class="card"><h3>القيم الافتراضية للمشروع الجديد</h3><div class="grid">${n('سعر كيلو الألومنيوم','kgPrice')}${n('سعر الدهان / كيلو','paintRate')}${n('المصنعية %','laborPct')}${n('سعر متر الزجاج','glassPrice')}${t('مسمى الزجاج','glassName')}</div></div>
    <div class="card"><h3>الهالك</h3><div class="grid">${n('هالك الألومنيوم %','waste')}${n('هالك الإكسسوار %','accWaste')}${n('هالك الزجاج %','glassWaste')}</div></div>
    <div class="card"><h3>أعواد الألومنيوم وتحسين القص</h3><div class="grid">${n('طول العود الأول (سم)','bars.0')}${n('طول العود التاني (سم)','bars.1')}${n('سمك سلاح المنشار (سم)','kerf')}
    <div><label>الأعواد المستخدمة</label><select onchange="setS('barMode',this.value)"><option value="best" ${s.barMode==='best'?'selected':''}>الاتنين – البرنامج يختار الأوفر</option><option value="a" ${s.barMode==='a'?'selected':''}>العود الأول بس</option><option value="b" ${s.barMode==='b'?'selected':''}>العود التاني بس</option></select></div></div></div>
    <div class="card"><h3>بيانات الشركة في عرض السعر</h3><div class="grid">${t('اسم الشركة','company.name')}${t('الوصف','company.tagline')}${t('التليفون','company.phone')}${t('العنوان','company.address')}</div>
    <label style="margin-top:8px">الشروط أسفل عرض السعر</label><textarea rows="3" oninput="setS('company.terms',this.value)">${esc(s.company.terms)}</textarea></div>`;
  }
  return tabs+body;
}
function ruleList(key){const t=curT();return key==='p'?t.rules:t.accRules}
function setRule(key,i,k,v){ruleList(key)[i][k]=v;save()}
function delRule(i){curT().rules.splice(i,1);save();render()}
function addRule(){curT().rules.push({g:'base',p:'p1',len:'W',n:1});save();render()}
function addAcc(){const n=$('#na_n').value.trim();if(!n)return toast('اكتب اسم الصنف');DB.catalog.acc.push({id:'x'+uid(),name:n,code:$('#na_c').value.trim(),unit:$('#na_u').value,price:+$('#na_p').value||0});save();render();toast('تمت الإضافة')}
function addAccRule(){const a=$('#ar_a').value,acc=DB.catalog.acc.find(x=>x.id===a),v=+$('#ar_n').value||0,g=$('#ar_g').value;
  const r={g,a}; if(acc.unit==='pc') r.n=v; else if(acc.unit==='m2') r.kwh=v; else {r.kw=v;r.kh=0}
  curT().accRules.push(r);save();render();toast('تمت الإضافة')}
function resetCat(){askConfirm('استرجاع كل القطاعات والأسعار والكميات للقيم الأصلية؟',()=>{DB.catalog=freshCatalog();DB.catVer=CAT_VER;save();render();toast('تم الاسترجاع')})}

load(); render();
</script>
</body>
</html>
